# 원래 백엔드의 DB 볼륨과 분리해 로컬 테스트 데이터를 보관합니다.
name: leren-front-test

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      # 호스트 DB_PORT를 바꿔도 컨테이너끼리 연결할 때는 내부 포트를 사용합니다.
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leren
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql/init:/docker-entrypoint-initdb.d   # 최초 1회: app·ai 스키마, 계정(migrator, app_user, ai_user), pgvector 생성
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leren"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
